name: Platform admin and WhatsApp feature checks

# Normal PR CI already includes these tests. Run this focused check only on demand.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_ENV: test
      SMTP_HOST: smtp.ci.invalid
      SMTP_USER: ci@example.invalid
      SMTP_PASS: fake-for-tests-only
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@v6
        with:
          path: .cache/mongodb-binaries
          key: mongo-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test tests/platform_admin.test.ts
      - run: bun test tests/whatsapp_embedded_signup.test.ts
