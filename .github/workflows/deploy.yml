name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; never cancel a deploy that is already running.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build, upload, switch, health-check
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    env:
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      APP_ROOT: /srv/restora/api
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "Repository variable DEPLOY_HOST is not set"; exit 1; }
          test -n "$SSH_KEY" || { echo "::error::Deployment SSH key is not configured"; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "::error::DEPLOY_KNOWN_HOSTS is not configured"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts


      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Build
        run: |
          bun install --frozen-lockfile
          bun run --if-present build
          # Ship production dependencies only (same OS/arch as the server: linux-x64).
          rm -rf node_modules
          bun install --frozen-lockfile --production

      - name: Package release
        run: |
          RELEASE="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "RELEASE=${RELEASE}" >> "$GITHUB_ENV"
          tar --exclude=.git --exclude=.github --exclude='*.tgz' -czf /tmp/release.tgz .

      - name: Upload release
        run: |
          scp -o StrictHostKeyChecking=yes /tmp/release.tgz \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${APP_ROOT}/releases/${RELEASE}.tgz"

      - name: Activate release (atomic switch + health check + auto-rollback)
        run: |
          ssh -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "${RELEASE}" <<'REMOTE'
          set -euo pipefail
          umask 027
          R="$1"; D=/srv/restora/api/releases
          mkdir -p "$D/$R"
          tar -xzf "$D/$R.tgz" -C "$D/$R"
          rm -f "$D/$R.tgz"
          restora-deploy "$R"
          REMOTE

      - name: Public smoke test
        if: ${{ vars.DEPLOY_URL != '' }}
        env:
          URL: ${{ vars.DEPLOY_URL }}${{ vars.HEALTH_PATH || '/health' }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "$URL" >/dev/null; then echo "✓ $URL"; exit 0; fi
            echo "waiting for $URL ($i/12)"; sleep 5
          done
          echo "✗ public URL did not become healthy" >&2; exit 1

      # Both WhatsApp routes require a session; unauthenticated callers must get 401,
      # never 404 (missing route) or HTML (wrong upstream).
      - name: Verify live WhatsApp routes
        env:
          API_ORIGIN: https://restora.live
        run: |
          set -euo pipefail
          for endpoint in signup/config connections; do
            url="${API_ORIGIN}/api/v1/whatsapp/${endpoint}"
            ready=0
            for attempt in $(seq 1 12); do
              status=$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "$url") || status="000"
              if [ "$status" = "401" ]; then
                echo "✓ ${url} responds 401 as expected for an unsigned-in request"
                ready=1
                break
              fi
              echo "Waiting for route ${endpoint}: HTTP ${status} (attempt ${attempt}/12)"
              sleep 5
            done
            if [ "$ready" -ne 1 ]; then
              echo "✗ WhatsApp API route ${endpoint} did not respond with the expected 401; check backend deployment" >&2
              exit 1
            fi
          done

      # restora.live is rendered by the same server (site/). Checked once SITE_URL (https://restora.live) is set.
      - name: Site smoke test
        if: ${{ vars.SITE_URL != '' }}
        env:
          URL: ${{ vars.SITE_URL }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "$URL" | grep -q '<title>'; then echo "✓ $URL"; exit 0; fi
            echo "waiting for $URL ($i/12)"; sleep 5
          done
          echo "✗ the site did not answer" >&2; exit 1

      - name: Clean up SSH material
        if: always()
        run: rm -rf ~/.ssh/id_ed25519 ~/.ssh/known_hosts /tmp/release.tgz
