name: Weekly dependency and Bun compatibility checks

on:
  workflow_dispatch:
  schedule:
    - cron: '11 3 * * 1'

permissions:
  contents: read

concurrency:
  group: backend-dependency-health
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit (non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun audit

  bun-canary:
    name: Latest Bun compatibility (non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    env:
      NODE_ENV: test
      SMTP_HOST: smtp.ci.invalid
      SMTP_USER: ci@example.invalid
      SMTP_PASS: ci-not-a-real-password
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: .cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check
