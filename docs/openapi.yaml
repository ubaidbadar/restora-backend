openapi: 3.1.0
info:
  title: Restora API
  version: 1.0.0
  description: |
    The Restora restaurant backend: orders, menu, tables, reservations, customers and khata, staff, roles and POS terminals.

    **Signing in.** Most routes need one of:
    - a Better Auth session cookie (someone's own sign-in, "web" mode; see `/api/v1/auth/*`), or
    - a registered POS terminal (`pos_device_token` cookie or `x-device-token` header) with someone unlocked on it by PIN ("pos" mode).

    The restaurant and branch always come from the session or terminal, never from the request.

    **Errors** are JSON `{ "message": "..." }`. Validation errors (400) also carry `issues`. Auth errors (401) and some 403s
    carry a `code`: `signed_out`, `pos_locked`, `context_lost` (with the current `me`) or `reauth_required`.

    **Permissions.** Each operation lists the permission it needs (`x-permission`). Owners have every permission.
    Routes marked "web only" refuse a POS terminal. Routes marked "fresh sign-in" need a sign-in from the last 10 minutes.
servers:
  - url: /
    description: This server
tags:
  - name: Health
  - name: Auth
  - name: Account
  - name: Restaurants
  - name: Branches
  - name: Settings
  - name: Menu
  - name: Orders
  - name: Tables
  - name: Guest requests
  - name: Reservations
  - name: Customers
  - name: Staff
  - name: Roles
  - name: Teams
  - name: Devices
  - name: Print agents
  - name: Push notifications
  - name: POS
  - name: Dashboard
  - name: Audit
  - name: Uploads
  - name: Public
security:
  - session: []
  - deviceToken: []
  - deviceCookie: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: The server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  timestamp: { type: string, format: date-time }

  /uploads/{fileName}:
    get:
      tags: [Uploads]
      summary: A locally stored image (when R2 is not configured)
      description: Serves PNG, JPEG, WebP and GIF files only.
      security: []
      parameters:
        - { name: fileName, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The image
          content:
            image/*:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/auth/{path}:
    get:
      tags: [Auth]
      summary: Better Auth (GET)
      description: |
        Handled by [Better Auth](https://www.better-auth.com/docs). Sign-up, sign-in, sign-out, session, password reset and
        email verification live here (for example `POST /api/v1/auth/sign-in/email`). `/api/auth/*` is an alias.

        Verification and password-reset emails carry a 6-digit code (10 minutes, 5 wrong tries) and the old link.
        `POST /send-verification-email {email}` and `POST /request-password-reset {email}` send them;
        `POST /email-otp/verify-email {email, otp}` confirms and signs in (the answer carries `me`), and
        `POST /email-otp/reset-password {email, otp, password}` sets a new password and signs out every device.

        Google: the web calls `POST /sign-in/social {provider: google, callbackURL, errorCallbackURL}`, follows the answer's
        `url` to Google, and comes back through `/callback/google` signed in (or to `errorCallbackURL?error=…`). The app
        signs in natively and sends `POST /sign-in/social {provider: google, idToken: {token}}`; the answer carries `me`.
        A Google email joins an existing account only once that account confirmed its email.
      security: []
      parameters:
        - { name: path, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: See Better Auth }
    post:
      tags: [Auth]
      summary: Better Auth (POST)
      security: []
      parameters:
        - { name: path, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: See Better Auth }

  # ---------------------------------------------------------------- Account
  /api/v1/me:
    get:
      tags: [Account]
      summary: Who is signed in and where they work
      description: Works on a POS terminal too, where it says who is unlocked.
      responses:
        '200':
          description: The current account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/workplace:
    post:
      tags: [Account]
      summary: Switch restaurant (web only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [restaurantId]
              properties:
                restaurantId: { type: string }
      responses:
        '200': { $ref: '#/components/responses/MeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/me/branch:
    post:
      tags: [Account]
      summary: Switch branch (web only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branchId]
              properties:
                branchId: { type: string }
      responses:
        '200': { $ref: '#/components/responses/MeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/me/sessions:
    get:
      tags: [Account]
      summary: List my signed-in sessions (web only)
      responses:
        '200': { $ref: '#/components/responses/Json' }
  /api/v1/me/sessions/revoke-others:
    post:
      tags: [Account]
      summary: Sign out everywhere else (web only)
      responses:
        '200': { $ref: '#/components/responses/Json' }
  /api/v1/me/sessions/{token}:
    delete:
      tags: [Account]
      summary: Sign out one session (web only)
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/me/profile:
    patch:
      tags: [Account]
      summary: Update my name (web only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/me/pin:
    post:
      tags: [Account]
      summary: Set my POS PIN (web only, fresh sign-in)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string, pattern: '^\d{4,6}$', description: 'Not an easy guess like 1234 or 0000' }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Restaurants
  /api/v1/restaurants:
    get:
      tags: [Restaurants]
      summary: Restaurants I work at (web only)
      description: Old app versions only. The apps read `restaurants` from `GET /api/v1/me` instead.
      deprecated: true
      responses:
        '200': { $ref: '#/components/responses/Json' }
  /api/v1/restaurants/{id}/keep:
    post:
      tags: [Restaurants]
      summary: Keep a restaurant that is scheduled for deletion (web only)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/onboarding:
    post:
      tags: [Restaurants]
      summary: Create a restaurant with its first branch (web only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, branchName]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                branchName: { type: string, minLength: 1, maxLength: 60 }
                area: { type: [string, 'null'] }
                city: { type: [string, 'null'] }
                phone: { type: [string, 'null'] }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  restaurantId: { type: string }
                  name: { type: string }
                  restaurant: { $ref: '#/components/schemas/Ref' }
                  branch: { $ref: '#/components/schemas/Ref' }
                  me: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/restaurant/transfer:
    post:
      tags: [Restaurants]
      summary: Transfer ownership (web only, fresh sign-in)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [membershipId, confirmName]
              properties:
                membershipId: { type: string }
                confirmName: { type: string, description: 'The restaurant name, typed to confirm' }
                keepMeAsOwner: { type: boolean, default: true }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/restaurant/delete:
    post:
      tags: [Restaurants]
      summary: Schedule the restaurant for deletion (web only, fresh sign-in)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmName]
              properties:
                confirmName: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/restaurant/leave:
    post:
      tags: [Restaurants]
      summary: Leave the current restaurant (web only)
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ---------------------------------------------------------------- Branches
  /api/v1/branches:
    get:
      tags: [Branches]
      summary: List branches
      x-permission: member
      parameters:
        - { name: all, in: query, description: 'true includes archived branches', schema: { type: boolean } }
      responses:
        '200': { $ref: '#/components/responses/Json' }
    post:
      tags: [Branches]
      summary: Add a branch
      x-permission: branches:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchInput' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/branches/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Branches]
      summary: Get a branch
      x-permission: member
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Branches]
      summary: Update a branch
      x-permission: branches:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchUpdate' }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Branches]
      summary: Archive a branch
      x-permission: branches:manage
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/branches/{id}/archive:
    post:
      tags: [Branches]
      summary: Archive a branch (same as DELETE)
      x-permission: branches:manage
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/branches/{id}/reopen:
    post:
      tags: [Branches]
      summary: Reopen an archived branch
      x-permission: branches:manage
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Settings
  /api/v1/settings:
    get:
      tags: [Settings]
      summary: Restaurant settings
      x-permission: member
      responses:
        '200': { $ref: '#/components/responses/Json' }
    patch:
      tags: [Settings]
      summary: Update restaurant settings
      x-permission: settings:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsUpdate' }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/settings/logo:
    post:
      tags: [Settings]
      summary: Upload the restaurant logo
      x-permission: settings:manage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary, description: 'Also accepted as `logo` or `image`. JPEG, PNG, WebP or GIF up to 5 MB.' }
          application/json:
            schema: { $ref: '#/components/schemas/DataUrlUpload' }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ---------------------------------------------------------------- Menu
  /api/v1/menu:
    get:
      tags: [Menu]
      summary: The full menu (categories, dishes, add-on groups)
      x-permission: menu:view
      responses:
        '200': { $ref: '#/components/responses/Json' }
  /api/v1/menu/categories:
    post:
      tags: [Menu]
      summary: Add a category
      x-permission: menu:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 40 }
                sortOrder: { type: integer, default: 0 }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/menu/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Menu]
      summary: Update a category
      x-permission: menu:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 40 }
                sortOrder: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Menu]
      summary: Delete a category
      x-permission: menu:update
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/menu/addon-groups:
    post:
      tags: [Menu]
      summary: Add an add-on group
      x-permission: menu:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddonGroupInput' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/menu/addon-groups/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Menu]
      summary: Update an add-on group
      x-permission: menu:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1 }
                min: { type: integer, minimum: 0 }
                max: { type: integer, minimum: 1 }
                options: { type: array, minItems: 1, items: { $ref: '#/components/schemas/AddonOption' } }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Menu]
      summary: Delete an add-on group
      x-permission: menu:update
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/menu/items:
    post:
      tags: [Menu]
      summary: Add a dish
      x-permission: menu:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuItemInput' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/menu/items/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Menu]
      summary: Update a dish
      description: Changes only the fields sent.
      x-permission: menu:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuItemUpdate' }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Menu]
      summary: Delete a dish
      x-permission: menu:update
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/menu/items/{id}/stock:
    patch:
      tags: [Menu]
      summary: Mark a dish sold out or back in stock
      x-permission: menu:stock
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [soldOut]
              properties:
                soldOut: { type: boolean }
                branchId: { type: string, description: Defaults to the active branch }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/menu/bulk:
    post:
      tags: [Menu]
      summary: Import a whole menu
      description: Categories and add-on groups are matched by name.
      x-permission: menu:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkMenu' }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ---------------------------------------------------------------- Orders
  /api/v1/orders:
    get:
      tags: [Orders]
      summary: List orders
      x-permission: orders:view
      parameters:
        - { name: date, in: query, description: 'Day in Pakistan time (YYYY-MM-DD). Defaults to today.', schema: { type: string, format: date } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: customerId, in: query, schema: { type: string } }
        - { name: allDates, in: query, description: 'true lists every day', schema: { type: boolean } }
      responses:
        '200': { $ref: '#/components/responses/Json' }
    post:
      tags: [Orders]
      summary: Place an order
      description: Sending the same `clientId` again (an offline sync or retry) returns the existing order with 200.
      x-permission: orders:create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreate' }
      responses:
        '200':
          description: The order already existed (same clientId)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/orders/stream:
    get:
      tags: [Orders]
      summary: Live orders (Server-Sent Events)
      description: |
        Orders of the restaurant (the active branch, when one is open) created or changed from now on, scoped like
        `GET /api/v1/orders`. Each event is `order.created` or `order.updated`, and its data is the order as JSON, the
        same shape as in the list: upsert it by `_id`. A `: ping` comment comes every 25 seconds. The server ends the
        stream after 5 minutes so the sign-in is checked again; reconnect, then load `GET /api/v1/orders` for anything
        missed in between. With `tables:view` too, the guests' calls from the table QR page also arrive:
        `call.created` and `call.updated` (`resolved: true` once seen to), with the call as JSON
        (`_id`, `tableId`, `tableName`, `type`, `resolved`, `createdAt`).
      x-permission: orders:view
      responses:
        '200':
          description: An event stream
          content:
            text/event-stream:
              schema: { type: string }
  /api/v1/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Orders]
      summary: Get an order
      x-permission: orders:view
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Orders]
      summary: Update an order's details
      x-permission: orders:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: '#/components/schemas/OrderStatus' }
                rider: { type: [string, 'null'] }
                area: { type: [string, 'null'] }
                address: { type: [string, 'null'] }
                discount: { type: number, minimum: 0 }
                deliveryFee: { type: number, minimum: 0 }
                tableId: { type: [string, 'null'] }
                tableName: { type: [string, 'null'] }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Orders]
      summary: Edit a placed order (what it is and what is in it)
      x-permission: orders:update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderEdit' }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/orders/{id}/status:
    patch:
      tags: [Orders]
      summary: Move an order along the board
      x-permission: orders:update
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/OrderStatus' }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/orders/{id}/payment:
    post:
      tags: [Orders]
      summary: Record a payment
      x-permission: orders:payment
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentMethod]
              properties:
                paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
                paymentStatus: { type: string, enum: [paid, khata], default: paid }
                discount: { type: number, minimum: 0 }
                deliveryFee: { type: number, minimum: 0 }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an order
      description: >-
        Saves who cancelled it, when and why in `cancellation`. A khata order stops being owed, with a reversal line.
        The body is optional, so apps from before reasons existed can still cancel.
      x-permission: orders:cancel
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { $ref: '#/components/schemas/CancelReason' }
                note: { type: string, maxLength: 200, description: Required when the reason is `other` }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Tables
  /api/v1/tables:
    get:
      tags: [Tables]
      summary: List tables
      x-permission: tables:view
      parameters:
        - { name: all, in: query, description: 'true includes archived tables', schema: { type: boolean } }
      responses:
        '200': { $ref: '#/components/responses/Json' }
    post:
      tags: [Tables]
      summary: Add a table
      x-permission: tables:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                branchId: { type: string }
                name: { type: string, minLength: 1, maxLength: 20 }
                section: { type: string, maxLength: 30, default: '' }
                seats: { type: [integer, 'null'], minimum: 1, maximum: 100 }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/tables/floor:
    get:
      tags: [Tables]
      summary: The floor view (tables with their open orders and guest calls)
      x-permission: tables:view
      responses:
        '200': { $ref: '#/components/responses/Json' }
  /api/v1/tables/batch:
    post:
      tags: [Tables]
      summary: Add many tables at once
      x-permission: tables:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [names]
              properties:
                branchId: { type: string }
                names: { type: array, minItems: 1, maxItems: 100, items: { type: string, minLength: 1, maxLength: 20 } }
                section: { type: string, maxLength: 30, default: '' }
                seats: { type: [integer, 'null'], minimum: 1, maximum: 100 }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/tables/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Tables]
      summary: Update a table
      x-permission: tables:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                branchId: { type: string }
                name: { type: string, minLength: 1, maxLength: 20 }
                section: { type: string, maxLength: 30 }
                seats: { type: [integer, 'null'], minimum: 1, maximum: 100 }
                archived: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Tables]
      summary: Archive a table
      x-permission: tables:manage
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/tables/{id}/qr:
    post:
      tags: [Tables]
      summary: Make a new QR code for a table (the old one stops working)
      x-permission: tables:manage
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/tables/{id}/archive:
    post:
      tags: [Tables]
      summary: Archive a table (same as DELETE)
      x-permission: tables:manage
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/tables/{id}/restore:
    post:
      tags: [Tables]
      summary: Restore an archived table
      x-permission: tables:manage
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Guest requests
  /api/v1/guest-requests/{id}:
    delete:
      tags: [Guest requests]
      summary: Resolve a guest call (same as POST resolve)
      x-permission: tables:view
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/guest-requests/{id}/resolve:
    post:
      tags: [Guest requests]
      summary: Resolve a guest call
      x-permission: tables:view
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Reservations
  /api/v1/reservations:
    get:
      tags: [Reservations]
      summary: List reservations
      x-permission: reservations:view
      parameters:
        - { name: date, in: query, description: Day (YYYY-MM-DD), schema: { type: string, format: date } }
      responses:
        '200': { $ref: '#/components/responses/Json' }
    post:
      tags: [Reservations]
      summary: Book a table
      description: Either `customerId`, or the guest's `name` and `phone` (saved as a customer if new). `newName` and `newPhone` are older names for the same fields.
      x-permission: reservations:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationCreate' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/reservations/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Reservations]
      summary: Get a reservation
      x-permission: reservations:view
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Reservations]
      summary: Update a reservation
      x-permission: reservations:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                partySize: { type: integer, minimum: 1, maximum: 500 }
                dateTime: { type: string, format: date-time }
                status: { $ref: '#/components/schemas/ReservationStatus' }
                tableId: { type: [string, 'null'], description: "'' or null means no table" }
                note: { type: [string, 'null'], maxLength: 300 }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Reservations]
      summary: Delete a reservation
      x-permission: reservations:manage
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Customers
  /api/v1/customers:
    get:
      tags: [Customers]
      summary: List or search customers
      x-permission: customers:view
      parameters:
        - { name: q, in: query, description: Name or part of a phone number, schema: { type: string, maxLength: 60 } }
        - { name: segment, in: query, schema: { type: string, enum: [inactive, vip, khata] } }
      responses:
        '200': { $ref: '#/components/responses/Json' }
    post:
      tags: [Customers]
      summary: Add a customer
      x-permission: customers:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerCreate' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/customers/import:
    post:
      tags: [Customers]
      summary: Import customers from a sheet
      x-permission: customers:import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customers]
              properties:
                customers:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  description: One object per sheet row, in sheet order
                  items:
                    type: object
                    properties:
                      name: { type: [string, number, 'null'] }
                      phone: { type: [string, number, 'null'] }
                      area: { type: [string, number, 'null'] }
                      openingKhata: { type: [number, 'null'] }
                onExisting: { type: string, enum: [skip, fill], default: skip }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/customers/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Customers]
      summary: Get a customer
      x-permission: customers:view
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Customers]
      summary: Update a customer
      x-permission: customers:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerUpdate' }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Customers]
      summary: Delete a customer
      x-permission: customers:delete
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/customers/{id}/merge:
    post:
      tags: [Customers]
      summary: Merge another customer into this one
      x-permission: customers:delete
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId]
              properties:
                customerId: { type: string, description: The customer merged into this one }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/customers/{id}/khata:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Customers]
      summary: The customer's khata (credit ledger)
      x-permission: customers:view
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Customers]
      summary: Add a khata payment or adjustment
      description: Order, opening, reversal and merge lines are written only by the server.
      x-permission: customers:khata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, amount]
              properties:
                type: { type: string, enum: [payment, adjustment] }
                amount: { type: number, description: 'Not 0. A payment is more than 0.' }
                note: { type: [string, 'null'], maxLength: 200 }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/customers/{id}/khata/{entryId}/reverse:
    post:
      tags: [Customers]
      summary: Reverse a khata entry
      x-permission: customers:khata
      parameters:
        - $ref: '#/components/parameters/Id'
        - { name: entryId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Staff
