        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/print-agents/{id}/printers/{systemName}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: systemName
        in: path
        required: true
        schema: { type: string }
        description: The printer's Windows name, URL-encoded.
    patch:
      tags: [Print agents]
      summary: Name a printer and say what it prints
      x-permission: devices:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, width, copies]
              properties:
                label: { type: string, minLength: 1, maxLength: 30, example: Kitchen }
                prints: { type: array, items: { type: string, enum: [kitchen, receipt] } }
                categoryIds: { type: array, items: { type: string }, description: 'Kitchen slips: only these menu categories. Empty: every dish.' }
                width: { type: integer, enum: [48, 32], description: Characters per line; 48 is an 80 mm roll, 32 is 58 mm. }
                copies: { type: integer, minimum: 1, maximum: 5 }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/print-agents/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Print agents]
      summary: Remove a print agent; it stops at once
      x-permission: devices:manage
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/print-jobs:
    post:
      tags: [Print agents]
      summary: Print an order's kitchen slips or receipt on the branch's printers
      description: Answers 409 when no printer is set up for it, so the app prints in the browser instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, kind]
              properties:
                orderId: { type: string }
                kind: { type: string, enum: [kitchen, receipt] }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '409': { description: No printer is set up for it }
  /api/v1/push-devices/web-key:
    get:
      tags: [Push notifications]
      summary: The key a browser subscribes to web push with; null while web push is not set up
      responses:
        '200': { $ref: '#/components/responses/Json' }
  /api/v1/push-devices:
    post:
      tags: [Push notifications]
      summary: Save this phone (Expo push token) or browser (web push subscription) for alerts on guests' orders and calls
      description: >-
        Saved for the person signed in and the restaurant and branch open now; saving again moves it. Alerts go to
        members with orders:view (guest orders) or tables:view (waiter and bill calls). Each alert carries
        `screen` (orders or tables) for what a tap opens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [kind, token]
                  properties:
                    kind: { type: string, enum: [expo] }
                    token: { type: string, example: 'ExponentPushToken[xxxx]' }
                - type: object
                  required: [kind, endpoint, keys]
                  properties:
                    kind: { type: string, enum: [web] }
                    endpoint: { type: string, format: uri }
                    keys:
                      type: object
                      required: [p256dh, auth]
                      properties:
                        p256dh: { type: string }
                        auth: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/push-devices/remove:
    post:
      tags: [Push notifications]
      summary: Forget this phone or browser (before signing out, or alerts turned off)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: The Expo token, or the browser's endpoint }
      responses:
        '200': { $ref: '#/components/responses/Json' }
  /api/v1/print-agent/pair:
    post:
      tags: [Print agents]
      summary: The agent pairs with the code; the answer holds its token (once)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, printers]
              properties:
                code: { type: string, pattern: '^\d{6}$' }
                version: { type: string }
                printers: { type: array, items: { type: string }, description: The printers Windows lists. }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { description: Too many wrong codes }
  /api/v1/print-agent/printers:
    put:
      tags: [Print agents]
      summary: The agent reports the printers Windows lists now
      description: Authorized with the agent's token (`Authorization Bearer`). Staff's names and settings are kept, and answered back (`printers`) for the agent to keep.
      security: []
      responses:
        '200': { $ref: '#/components/responses/Json' }
  /api/v1/print-agent/jobs:
    get:
      tags: [Print agents]
      summary: Slips waiting for this agent, oldest first; also its heartbeat
      description: Authorized with the agent's token. The agent asks every few seconds.
      security: []
      responses:
        '200': { $ref: '#/components/responses/Json' }
  /api/v1/print-agent/jobs/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Print agents]
      summary: The agent says a slip is printed, or failed
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [printed, failed] }
                error: { type: string, maxLength: 300 }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- POS
  /api/v1/pos/state:
    get:
      tags: [POS]
      summary: The terminal's state (who is unlocked, if anyone)
      security: [{ deviceToken: [] }, { deviceCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/pos/people:
    get:
      tags: [POS]
      summary: The people who can unlock this terminal
      security: [{ deviceToken: [] }, { deviceCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/pos/unlock:
    post:
      tags: [POS]
      summary: Unlock the terminal with a PIN
      security: [{ deviceToken: [] }, { deviceCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [membershipId, pin]
              properties:
                membershipId: { type: string }
                pin: { type: string, pattern: '^\d{4,6}$' }
      responses:
        '200': { $ref: '#/components/responses/MeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/pos/lock:
    post:
      tags: [POS]
      summary: Lock the terminal
      security: [{ deviceToken: [] }, { deviceCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- Dashboard
  /api/v1/dashboard:
    get:
      tags: [Dashboard]
      summary: Today's numbers
      description: >-
        Sales, orders, payments and order types leave out cancelled orders; `stats.cancelled` counts them apart
        (`count`, `value`, and `byReason` with each reason's count and value). In `perBranch`, each branch also has its
        `cancelledCount`.
      x-permission: reports:view
      parameters:
        - { name: scope, in: query, description: '`all` needs reports:view_all_branches', schema: { type: string, enum: [branch, all], default: branch } }
        - { name: date, in: query, description: 'Day in Pakistan time (YYYY-MM-DD). Defaults to today.', schema: { type: string, format: date } }
      responses:
        '200': { $ref: '#/components/responses/Json' }

  # ---------------------------------------------------------------- Audit
  /api/v1/audit:
    get:
      tags: [Audit]
      summary: The activity log
      x-permission: audit:view
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: action, in: query, description: 'For example `order.created`', schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Json' }

  # ---------------------------------------------------------------- Uploads
  /api/v1/uploads:
    post:
      tags: [Uploads]
      summary: Upload an image
      description: Stored in Cloudflare R2 when configured, otherwise on local disk.
      x-permission: menu:update or settings:manage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary, description: 'Also accepted as `image`, `logo` or `photo`. JPEG, PNG, WebP or GIF up to 5 MB.' }
                folder: { type: string }
          application/json:
            schema: { $ref: '#/components/schemas/DataUrlUpload' }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Upload' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/uploads/presign:
    post:
      tags: [Uploads]
      summary: Get a presigned URL for a direct upload to R2
      x-permission: menu:update or settings:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType]
              properties:
                contentType: { type: string, enum: [image/jpeg, image/png, image/webp, image/gif] }
                filename: { type: string }
                folder: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '501': { description: R2 is not configured, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/uploads/{key}:
    delete:
      tags: [Uploads]
      summary: Delete an uploaded file of this restaurant
      x-permission: menu:update or settings:manage
      parameters:
        - { name: key, in: path, required: true, description: 'The storage key, starting with `r_<restaurantId>/`', schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Public
  /api/v1/public/sign-in-providers:
    get:
      tags: [Public]
      summary: The sign-in buttons to show
      description: Providers configured on this server, for the web and for the app. Empty lists hide the buttons.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  web: { type: array, items: { type: string, enum: [google] } }
                  app: { type: array, items: { type: string, enum: [google] } }
  /api/v1/public/t/{code}:
    get:
      tags: [Public]
      summary: The menu for a table's QR code
      security: []
      parameters:
        - $ref: '#/components/parameters/TableCode'
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/public/t/{code}/call:
    post:
      tags: [Public]
      summary: Call a waiter or ask for the bill
      security: []
      parameters:
        - $ref: '#/components/parameters/TableCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [waiter, bill] }
                type: { type: string, enum: [waiter, bill], description: Accepted instead of `kind` }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/public/t/{code}/order:
    post:
      tags: [Public]
      summary: A guest orders from the table
      description: |
        Saved as a dine-in order for the table with status `pending`, priced from the menu, unpaid. Staff accept it
        (`PATCH /api/v1/orders/{id}/status` to `new`) or cancel it; it cannot be paid while pending. At most 3 of a
        table's orders wait at once (429 after that). Sending the same `clientId` again answers the same order.
      security: []
      parameters:
        - $ref: '#/components/parameters/TableCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items:
                    type: object
                    required: [itemId, qty]
                    properties:
                      itemId: { type: string }
                      sizeId: { type: string }
                      addonIds: { type: array, items: { type: string } }
                      note: { type: string }
                      qty: { type: integer, minimum: 1, maximum: 20 }
                clientId: { type: string, minLength: 8, maxLength: 64 }
      responses:
        '201':
          description: The order, in short
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id: { type: string }
                  dailyToken: { type: integer }
                  status: { type: string, enum: [pending] }
                  total: { type: number }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { description: Too many of the table's orders are still waiting }
  /api/v1/public/t/{code}/opt-in:
    post:
      tags: [Public]
      summary: A guest agrees to WhatsApp offers
      security: []
      parameters:
        - $ref: '#/components/parameters/TableCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, consent]
              properties:
                name: { type: string, maxLength: 80 }
                phone: { $ref: '#/components/schemas/Phone' }
                consent: { type: boolean, const: true }
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Better Auth session cookie, set by signing in at /api/v1/auth.
    deviceCookie:
      type: apiKey
      in: cookie
      name: pos_device_token
      description: A registered POS terminal. Most routes also need someone unlocked on it.
    deviceToken:
      type: apiKey
      in: header
      name: x-device-token
      description: A registered POS terminal, sent as a header.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    TableCode:
      name: code
      in: path
      required: true
      description: >-
        The code in the table's QR link: `restaurant/table-key` (e.g. `ubaids-tandoor-house/t1-7k2m9q`, sent as two
        path segments), or the single random code of a table made before readable links. A code printed before the
        table's current one still works until its QR code is made new.
      schema: { type: string }

  responses:
    Json:
      description: OK
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    Created:
      description: Created
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    MeResponse:
      description: OK; includes the updated `me` where it changed
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    Unauthorized:
      description: Not signed in, or the terminal is locked
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Missing permission, wrong mode, or a fresh sign-in is needed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: A record with this unique identifier already exists
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        code: { type: string, enum: [signed_out, pos_locked, context_lost, reauth_required] }
        me: { $ref: '#/components/schemas/Me' }
    ValidationError:
      type: object
      required: [message]
      properties:
        message: { type: string, description: 'The first problem, ready to show' }
        issues: { type: array, items: { type: object, additionalProperties: true } }
    Ref:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
    Phone:
      type: string
      description: A Pakistani mobile number like 0300 1234567; saved as +923…
      example: 0300 1234567
    Permission:
      type: string
      enum:
        - orders:view
        - orders:create
        - orders:update
        - orders:payment
        - orders:discount
        - orders:cancel
        - customers:view
        - customers:manage
        - customers:khata
        - customers:import
        - customers:delete
        - reservations:view
        - reservations:manage
        - tables:view
        - tables:manage
        - menu:view
        - menu:update
        - menu:stock
        - reports:view
        - reports:view_all_branches
        - staff:view
        - staff:invite
        - staff:manage
        - teams:manage
        - roles:manage
        - settings:manage
        - branches:manage
        - devices:manage
        - audit:view
    OrderType: { type: string, enum: [dine_in, takeaway, delivery] }
    OrderStatus: { type: string, enum: [pending, new, preparing, ready, out_for_delivery, completed, cancelled] }
    CancelReason: { type: string, enum: [customer_left, wrong_order, out_of_stock, duplicate, other] }
    PaymentMethod: { type: string, enum: [cash, card, jazzcash, easypaisa, bank] }
    PaymentStatus: { type: string, enum: [paid, unpaid, khata] }
    ReservationStatus: { type: string, enum: [pending, confirmed, seated, cancelled] }

    Me:
      type: object
      properties:
        user:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            email: { type: string }
            image: { type: string, description: Left out when there is none }
        mode: { type: string, enum: [web, pos] }
        workplace:
          oneOf:
            - { $ref: '#/components/schemas/Workplace' }
            - { type: 'null' }
        restaurants:
          type: array
          description: |
            Every restaurant they belong to, oldest first (empty on a terminal). One without `status` can be opened.
            A restaurant being deleted is listed only for its owner, who can keep it. Empty fields are left out.
          items:
            type: object
            properties:
              _id: { type: string }
              name: { type: string }
              logo: { type: string }
              isOwner: { type: boolean, enum: [true] }
              status: { type: string, enum: [suspended, deleting] }
              deleteAfter: { type: string, format: date-time }
        device:
          type: object
          description: Only in `pos` mode
          properties:
            _id: { type: string }
            name: { type: string }
            settings:
              type: object
              properties:
                idleLockSeconds: { type: integer }
                lockAfterOrder: { type: boolean }
    Workplace:
      type: object
      properties:
        restaurant:
          type: object
          properties:
            _id: { type: string }
            name: { type: string }
            logo: { type: string }
        roleNames: { type: array, items: { type: string } }
        isOwner: { type: boolean }
        isPrimaryOwner: { type: boolean }
        hasPin: { type: boolean }
        permissions: { type: array, items: { $ref: '#/components/schemas/Permission' } }
        branch:
          type: [object, 'null']
          properties:
            _id: { type: string }
            name: { type: string }
            address: { type: string }
            area: { type: string }
            city: { type: string }
            phone: { type: string }
        allBranches: { type: boolean }
        branches: { type: array, items: { $ref: '#/components/schemas/Ref' } }
        settings: { type: object, additionalProperties: true }

    BranchInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        address: { type: [string, 'null'] }
        area: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
    BranchUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        address: { type: [string, 'null'] }
        area: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }

    SettingsUpdate:
      type: object
      description: Read-only fields the client echoes back (like `taxSet`) are ignored. Saving any tax rate marks tax as set.
      properties:
        restaurantName: { type: string, minLength: 1 }
        logo: { type: [string, 'null'] }
        taxByPaymentMethod:
          type: object
          description: Percent, 0 to 100
          properties:
            cash: { type: number, minimum: 0, maximum: 100 }
            card: { type: number, minimum: 0, maximum: 100 }
            jazzcash: { type: number, minimum: 0, maximum: 100 }
            easypaisa: { type: number, minimum: 0, maximum: 100 }
            bank: { type: number, minimum: 0, maximum: 100 }
        whatsappTemplates:
          type: object
          properties:
            winback: { type: string }
            reservation: { type: string }
        receipt:
          type: object
          properties:
            ntn: { type: string, maxLength: 30 }
            strn: { type: string, maxLength: 30 }
            footer: { type: string, maxLength: 160 }

    MenuSize:
      type: object
      required: [price]
      properties:
        _id: { type: string }
        name: { type: string, default: '', description: 'Empty for a single price' }
        price: { type: number, minimum: 0 }
    MenuItemInput:
      type: object
      required: [categoryId, name, sizes]
      properties:
        categoryId: { type: string }
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 200, default: '' }
        photo: { type: [string, 'null'], description: 'A data URL (a new photo, saved in three sizes: see docs/photos.md), a URL to keep, or null to remove it. Answers carry photoSizes { sm, md, width, height, blur }.' }
        sizes: { type: array, minItems: 1, items: { $ref: '#/components/schemas/MenuSize' } }
        addonGroupIds: { type: array, items: { type: string }, default: [] }
        includes: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/DealPart' }, description: 'A deal: the dishes in it (plain dishes, not deals). Empty for a dish. A dish in a deal cannot be deleted.' }
        days: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: 'Days it is sold on, 0 is Sunday; empty is every day' }
        from: { type: string, description: "'HH:mm' in Pakistan time, with to; '' is all day. to before from runs past midnight. Orders outside are refused." }
        to: { type: string }
        hidden: { type: boolean, default: false }
    MenuItemUpdate:
      type: object
      properties:
        categoryId: { type: string }
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 200 }
        photo: { type: [string, 'null'], description: 'A data URL (a new photo, saved in three sizes: see docs/photos.md), a URL to keep, or null to remove it. Answers carry photoSizes { sm, md, width, height, blur }.' }
        sizes: { type: array, minItems: 1, items: { $ref: '#/components/schemas/MenuSize' } }
        addonGroupIds: { type: array, items: { type: string } }
        includes: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/DealPart' }, description: 'A deal: the dishes in it (plain dishes, not deals). Empty for a dish. A dish in a deal cannot be deleted.' }
        days: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: 'Days it is sold on, 0 is Sunday; empty is every day' }
        from: { type: string, description: "'HH:mm' in Pakistan time, with to; '' is all day. to before from runs past midnight. Orders outside are refused." }
        to: { type: string }
        hidden: { type: boolean }
    DealPart:
      type: object
      required: [itemId, qty]
      properties:
        itemId: { type: string }
        sizeId: { type: string, description: "The dish's first size when not set" }
        qty: { type: integer, minimum: 1, maximum: 20 }
    AddonOption:
      type: object
      required: [name]
      properties:
        _id: { type: string }
        name: { type: string, minLength: 1 }
        price: { type: number, minimum: 0, default: 0 }
    AddonGroupInput:
      type: object
      required: [name, options]
      description: '`min` is at most `max` and at most the number of options.'
      properties:
        name: { type: string, minLength: 1 }
        min: { type: integer, minimum: 0, default: 0 }
        max: { type: integer, minimum: 1, default: 1 }
        options: { type: array, minItems: 1, items: { $ref: '#/components/schemas/AddonOption' } }
    BulkMenu:
      type: object
      properties:
        addonGroups:
          type: array
          maxItems: 100
          items:
            type: object
            required: [name, options]
            properties:
              name: { type: string, minLength: 1, maxLength: 60 }
              min: { type: integer, minimum: 0, default: 0 }
              max: { type: integer, minimum: 1, default: 1 }
              options:
                type: array
                minItems: 1
                maxItems: 50
                items:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string, minLength: 1, maxLength: 60 }
                    price: { type: number, minimum: 0, default: 0 }
        items:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [category, name, sizes]
            properties:
              category: { type: string, minLength: 1, maxLength: 40 }
              name: { type: string, minLength: 1, maxLength: 80 }
              sizes:
                type: array
                minItems: 1
                maxItems: 10
                items:
                  type: object
                  required: [price]
                  properties:
                    name: { type: string, default: '' }
                    price: { type: number, minimum: 0 }
              addons: { type: array, items: { type: string }, description: Add-on group names }

    OrderItemInput:
      type: object
      required: [itemId, qty]
      properties:
        itemId: { type: string }
        sizeId: { type: [string, 'null'] }
        addonIds: { type: array, items: { type: string }, default: [] }
        note: { type: [string, 'null'] }
        qty: { type: integer, minimum: 1 }
    OrderCreate:
      type: object
      required: [items, type]
      description: |
        A dine-in order needs `tableId` or `tableName`; a delivery needs `address`. A paid or khata order needs
        `paymentMethod`; a khata order needs a customer (`customerId` or `newName`).
      properties:
        branchId: { type: string }
        customerId: { type: [string, 'null'] }
        newName: { type: [string, 'null'] }
        newPhone: { type: [string, 'null'] }
        items: { type: array, minItems: 1, items: { $ref: '#/components/schemas/OrderItemInput' } }
        type: { $ref: '#/components/schemas/OrderType' }
        tableId: { type: [string, 'null'] }
        tableName: { type: [string, 'null'] }
        area: { type: [string, 'null'] }
        address: { type: [string, 'null'] }
        rider: { type: [string, 'null'] }
        deliveryFee: { type: number, minimum: 0, default: 0 }
        discount: { type: number, minimum: 0, default: 0 }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        paymentStatus: { allOf: [{ $ref: '#/components/schemas/PaymentStatus' }], default: unpaid }
        clientId: { type: string, minLength: 8, maxLength: 64, description: 'Made on the device; makes retries safe' }
        placedAt: { type: string, format: date-time, description: 'When it was taken, if offline' }
    OrderEdit:
      type: object
      required: [items, type]
      properties:
        customerId: { type: [string, 'null'] }
        newName: { type: [string, 'null'] }
        newPhone: { type: [string, 'null'] }
        items: { type: array, minItems: 1, items: { $ref: '#/components/schemas/OrderItemInput' } }
        type: { $ref: '#/components/schemas/OrderType' }
        tableId: { type: [string, 'null'] }
        tableName: { type: [string, 'null'] }
        area: { type: [string, 'null'] }
        address: { type: [string, 'null'] }
        rider: { type: [string, 'null'] }
        deliveryFee: { type: number, minimum: 0, default: 0 }
        discount: { type: number, minimum: 0, default: 0 }
    Order:
      type: object
      properties:
        _id: { type: string }
        dailyToken: { type: integer, description: The order number for the day }
        branchId: { type: string }
        customerId: { type: string }
        customer:
          type: object
          properties:
            _id: { type: string }
            name: { type: string }
            phone: { type: string }
        type: { $ref: '#/components/schemas/OrderType' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        items:
          type: array
          items:
            type: object
            properties:
              itemId: { type: string }
              name: { type: string }
              sizeId: { type: string }
              sizeName: { type: string }
              addonIds: { type: array, items: { type: string } }
              addons: { type: array, items: { type: object, properties: { name: { type: string }, price: { type: number } } } }
              includes: { type: array, description: 'A deal: the dishes in one deal, as they were when ordered', items: { type: object, properties: { name: { type: string }, sizeName: { type: string }, qty: { type: integer } } } }
              note: { type: string }
              price: { type: number }
              qty: { type: integer }
        subtotal: { type: number }
        discount: { type: number }
        taxRate: { type: number }
        tax: { type: number }
        deliveryFee: { type: number }
        total: { type: number }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        tableId: { type: string }
        tableName: { type: string }
        area: { type: string }
        address: { type: string }
        rider: { type: string }
        takenBy: { type: string }
        dayKey: { type: string, description: YYYY-MM-DD in Pakistan time }
        clientId: { type: string }
        placedAt: { type: string, format: date-time }
        cancellation:
          type: object
          description: Set when the order is cancelled
          properties:
            reason: { $ref: '#/components/schemas/CancelReason' }
            note: { type: string }
            byName: { type: string }
            at: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ReservationCreate:
      type: object
      required: [partySize, dateTime]
      properties:
        branchId: { type: string }
        customerId: { type: [string, 'null'] }
        name: { type: [string, 'null'], maxLength: 80 }
        phone: { $ref: '#/components/schemas/Phone' }
        newName: { type: [string, 'null'], maxLength: 80, deprecated: true }
        newPhone: { allOf: [{ $ref: '#/components/schemas/Phone' }], deprecated: true }
        partySize: { type: integer, minimum: 1, maximum: 500 }
        dateTime: { type: string, format: date-time }
        status: { allOf: [{ $ref: '#/components/schemas/ReservationStatus' }], default: pending }
        tableId: { type: [string, 'null'], description: "'' or null means no table" }
        note: { type: [string, 'null'], maxLength: 300 }

    CustomerCreate:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, minLength: 1 }
        phone: { $ref: '#/components/schemas/Phone' }
        altPhone: { type: [string, 'null'] }
        area: { type: string }
        tags: { description: 'A list, or one comma- or line-separated string', oneOf: [{ type: array, items: { type: string } }, { type: string }] }
        addresses: { description: 'A list, or one comma- or line-separated string', oneOf: [{ type: array, items: { type: string } }, { type: string }] }
        notes: { type: string }
        openingKhata: { type: number, default: 0, description: What they already owe }
    CustomerUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        phone: { $ref: '#/components/schemas/Phone' }
        altPhone: { type: [string, 'null'] }
        area: { type: string }
        tags: { oneOf: [{ type: array, items: { type: string } }, { type: string }] }
        addresses: { oneOf: [{ type: array, items: { type: string } }, { type: string }] }
        notes: { type: string }

    Access:
      type: object
      required: [roleIds, branchScope]
      properties:
        roleIds: { type: array, minItems: 1, items: { type: string } }
        branchScope: { type: string, enum: [all, list] }
        branchIds: { type: array, items: { type: string }, default: [], description: Needed when branchScope is list }
    Invite:
      type: object
      required: [channel, roleIds]
      properties:
        channel: { type: string, enum: [email, phone] }
        email: { type: string, format: email, description: Needed for the email channel }
        phone: { $ref: '#/components/schemas/Phone' }
        name: { type: [string, 'null'] }
        roleIds: { type: array, minItems: 1, items: { type: string } }
        branchScope: { type: string, enum: [all, list], default: all }
        branchIds: { type: array, items: { type: string }, default: [] }

    DataUrlUpload:
      type: object
      required: [dataUrl]
      properties:
        dataUrl: { type: string, description: 'data:image/...;base64,... (JPEG, PNG, WebP or GIF, up to 5 MB)' }
        folder: { type: string }
    Upload:
      type: object
      properties:
        url: { type: string }
        key: { type: string }
        size: { type: integer }
        contentType: { type: string }
        storage: { type: string, enum: [cloudflare-r2, local] }
