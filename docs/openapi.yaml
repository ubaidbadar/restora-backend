      summary: Reset a preset role to its defaults
      x-permission: roles:manage
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Json' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Teams
  /api/v1/teams:
    get:
